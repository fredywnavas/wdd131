<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Area, California</title>
    <meta name="description" content="This website has information about a place and its interesting facts and other data.">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/place.js" defer></script>
    <script src="scripts/getdates.js" defer></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Bay Area, California.</h1>
    </header>

    <main>
        <!--HERO IMAGE SECTION-->
        <section class="hero">
            <picture>
                <source media="(min-width: 768px)" srcset="images/bay-area-large.webp">
                <img src="images/bay-area-small.webp" alt="Bay Area, California">
            </picture>
            
            <div class="cards">
                <!--DATA SECTION-->
                <section class="data">
                    <h2>Data</h2>
                    <p>Data of the Bay Area, California.</p>
                </section>

                <!--WEATHER SECTION-->
                <section class="weather">
                    <h2>Weather <span class="emoji">🌤️</span></h2>
                    <figure>
                        <!--mobile view-->
                        <img src="images/weather-icon.svg" alt="Weather icon">
                    </figure>
                    <p>Temperature: <span id="temperature">55°F</span></p>
                    <p>Wind Speed: <span id="wind-speed">10 mph</span></p>
                    <p>Wind Chill: <span id="wind-chill"></span></p>
                </section>
            </div>
        </section>
    </main>

    <footer>
        <p>
        <span class="copyright">&copy;</span> <span id="currentyear"></span> Fredy Navas, Bay Area, California.
        </p>

        <p id="lastModified">

        </p>
    </footer>
</body>
</html>
