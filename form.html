<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fredy Navas">
    <title>Product Review Form</title>
    <meta name="description"
        content="This document is a form to submit product reviews.">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>

    <!--Google Fonts: roboto mono-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">
</head>
<body>
    
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <label for="rating1">1 ☆</label>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating2">2 ☆☆</label>
                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating3">3 ☆☆☆</label>
                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating4">4 ☆☆☆☆</label>
                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating5">5 ☆☆☆☆☆</label>
                <input type="radio" id="rating5" name="rating" value="5" required>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which faetures did you find useful in the product?
                    <br>
                    (Check all that apply)
                </legend>
                <label for="Durability">Durability</label>
                <input type="checkbox" id="Durability">
                <label for="Easy of Use">Easy of Use</label>
                <input type="checkbox" id="Easy of Use">
                <label for="Performance">Performance</label>
                <input type="checkbox" id="Performance">
                <label for="Design">Design</label>
                <input type="checkbox" id="Design">
            </fieldset>

            <label for="review">Written Review (optional)</label>
            <textarea id="review" name="review"></textarea>

            <label for="userName">Your Name</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit Review">

        </form>

    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Fredy Navas, California, USA.</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
